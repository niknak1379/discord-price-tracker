name: upload docker image on Push and deploy

on:
  push:
    branches:
      - main

jobs:
  test:
    if: "!contains(github.event.head_commit.message, '[skip test]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test -v -race ./...

  determine-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.set-runner.outputs.runner }}
    steps:
      - name: Determine which runner to use
        id: set-runner
        uses: benjaminmichaelis/get-soonest-available-runner@v1.1.0
        with:
          primary-runner: "self-hosted"
          fallback-runner: "ubuntu-latest"
          min-available-runners: 1
          github-token: ${{ secrets.GHTOKEN_DETERMINERUNNER }}

  dockerize:
    needs: [test, determine-runner]
    runs-on: ${{ needs.determine-runner.outputs.runner }}
    environment: .env
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.9.0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESSTOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64/v8
          push: true
          tags: |
            nikanostovan/price-tracker:latest
            nikanostovan/price-tracker:${{ github.sha }}
          cache-from: ${{ needs.determine-runner.outputs.runner == 'self-hosted' && 'type=gha,scope=main' || '' }}
          cache-to: ${{ needs.determine-runner.outputs.runner == 'self-hosted' && 'type=gha,mode=max,scope=main' || '' }}

  deploy:
    runs-on: ubuntu-latest
    environment: .env
    needs: [dockerize]
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:master

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: copy compose.yml and .env
        run: |
          mkdir -p price-tracker
          cp docker-compose.yml price-tracker/docker-compose.yml
          cd price-tracker
          cat > .env << EOL
          APPLICATION_ID=${{ secrets.APPLICATION_ID }}
          PUBLIC_KEY=${{ secrets.PUBLIC_KEY }}
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          CHANNEL_ID=${{ secrets.CHANNEL_ID }}
          GEO_API_KEY=${{ secrets.GEO_API_KEY }}
          HOME_LAT=${{ secrets.HOME_LAT }}
          HOME_LONG=${{ secrets.HOME_LONG }}
          OPENVPN_USER=${{secrets.OPENVPN_USER}}
          OPENVPN_PASSWORD=${{secrets.OPENVPN_PASSWORD}}
          WIREGUARD_ADDRESSES=${{secrets.WIREGUARD_ADDRESSES}}
          WIREGUARD_PRIVATE_KEY=${{secrets.WIREGUARD_PRIVATE_KEY}}
          EOL
          cd ..
          scp -r -o "StrictHostKeyChecking no" price-tracker ${{ secrets.RASPBERRYPI_USER }}@${{ secrets.RASPBERRYPI_TAILSCALE_IP }}:~/
      - name: Docker Compose Pull
        run: |
          ssh -o "StrictHostKeyChecking no" ${{ secrets.RASPBERRYPI_USER }}@${{ secrets.RASPBERRYPI_TAILSCALE_IP }} << 'EOF'
              cd price-tracker
              sudo docker compose pull
              sudo docker compose down
              sudo docker compose up --remove-orphans -d
              echo "Running containers:"
              sudo docker compose ps
              echo "Container logs:"
              sudo docker compose logs --tail=50
              sudo docker image prune -f
          EOF
