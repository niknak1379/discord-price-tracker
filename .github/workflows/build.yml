name: Build Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/deploy.yml'
      - 'docker-compose.yml'
      - 'loki-config.yml'
      - 'alloy-config.river'
      - 'grafana-provisioning/**'
      - '*.md'
  workflow_dispatch:

jobs:
  test:
    if: "!contains(github.event.head_commit.message, '[skip test]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test -v -race ./...

  choose-runner:
    runs-on: ubuntu-latest
    environment: .env
    outputs:
      runner: ${{ steps.choose-runner.outputs.runner }}
    steps:
      - id: choose-runner
        uses: QCDIS/choose-action-runner@v2
        with:
          preferred-runner: self-hosted
          fallback-runner: ubuntu-latest
          github-token: ${{ secrets.GHTOKEN_DETERMINERUNNER }}

  dockerize:
    needs: [choose-runner]
    runs-on: ${{ needs.choose-runner.outputs.runner }}
    environment: .env
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.9.0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESSTOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64/v8
          push: true
          tags: |
            nikanostovan/price-tracker:latest
            nikanostovan/price-tracker:${{ github.sha }}
          cache-from: ${{ needs.choose-runner.outputs.runner == 'self-hosted' && 'type=gha,scope=main' || '' }}
          cache-to: ${{ needs.choose-runner.outputs.runner == 'self-hosted' && 'type=gha,mode=max,scope=main' || '' }}

  deploy:
    needs: [dockerize, test]
    if: github.event_name == 'push'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
