services:
  backend:
    image: nikanostovan/price-tracker:latest
    container_name: price-tracker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PROXY_URL_LIST=gluetun,gluetun2,gluetun3
      - EBAY_ZIP=${EBAY_ZIP:-94104}
      - APPLICATION_ID=${APPLICATION_ID}
      - PUBLIC_KEY=${PUBLIC_KEY}
      - MONGODB_URI=${MONGODB_URI}
      - CHANNEL_ID=${CHANNEL_ID}
      - GEO_API_KEY=${GEO_API_KEY}
      - HOME_LAT=${HOME_LAT}
      - HOME_LONG=${HOME_LONG}
    ports:
      - "6060:6060"
    depends_on:
      - gluetun
      - gluetun2
      - gluetun3
    volumes:
      - log-data:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  gluetun:
    image: qmcgaw/gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - gluetun-data:/gluetun
    environment:
      # See https://github.com/qdm12/gluetun-wiki/tree/main/setup#setup
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      - OPENVPN_PROTOCOL=tcp
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - FREE_ONLY=on
      - SERVER_COUNTRIES=United States
      # Step 5: pin exit city to match EBAY_ZIP (default 94104 = San Francisco CA).
      # Gluetun requires the full "City ST" form, e.g. "San Francisco CA".
      # Set PROTON_CITY / MULLVAD_CITY in .env if you change EBAY_ZIP.
      - SERVER_CITIES=${PROTON_CITY:-San Jose}
      - HTTPPROXY=on
      - UPDATER_PERIOD=12h
      - HTTPPROXY_STEALTH=on
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  gluetun2:
    image: qmcgaw/gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      # gluetun2 uses your existing key pair.
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=USA
      - SERVER_CITIES=San Francisco CA
      - HTTPPROXY=on
      - HTTPPROXY_STEALTH=on
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  gluetun3:
    image: qmcgaw/gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      # gluetun3 MUST use a different device/key than gluetun2.
      # Generate a 2nd key in Mullvad and set these in .env.
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY_2}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES_2}
      - SERVER_COUNTRIES=USA
      - SERVER_CITIES=San Jose CA
      - HTTPPROXY=on
      - HTTPPROXY_STEALTH=on
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy-config.river:/etc/alloy/config.river
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.river
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  log-data:
  gluetun-data:
  loki-data:
  grafana-data:
